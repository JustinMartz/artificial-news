plugins {
	id 'java'
	id 'war'
	id 'org.springframework.boot' version '3.5.0'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.diffplug.spotless' version '7.2.1'
}

group = 'dev.justinmartz'
version = '0.2.0'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

ext {
	springAiVersion = "1.0.1"
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.ai:spring-ai-starter-model-openai'

	runtimeOnly 'com.h2database:h2'
	providedRuntime 'org.springframework.boot:spring-boot-starter-tomcat'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
	}
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.register('bootRunDev', org.springframework.boot.gradle.tasks.run.BootRun) {
	group = 'application'
	description = 'Run with spring.profiles.active=dev'
	args = ['--spring.profiles.active=dev']
	classpath = sourceSets.main.runtimeClasspath
	mainClass.set('dev.justinmartz.artificial_news.ArtificialNewsApplication')
}

tasks.named('war') {
	archiveBaseName.set("artificial-news")
	archiveFileName.set("${archiveBaseName.get()}.war")
	destinationDirectory.set(file("../../"))
}

spotless {
	ratchetFrom 'origin/main'

	format 'misc', {
		target '*.gradle', '.gitattributes', '.gitignore'
		trimTrailingWhitespace()
		leadingSpacesToTabs()
		endWithNewline()
	}

	java {
		googleJavaFormat('1.28.0')
				.aosp()
				.reflowLongStrings()
				.skipJavadocFormatting()
		formatAnnotations()
		licenseHeader '/* (C)$YEAR */'
	}
}
